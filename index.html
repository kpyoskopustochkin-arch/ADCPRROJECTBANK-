<style>
  :root{
    --bg-0:#000000; --bg-1:#0d0d0f; --bg-2:#18181b; --bg-2-hover:#212124;
    --line:#26262a; --text-0:#f5f5f7; --text-1:#8e8e93; --text-2:#57575c;
    --brand-grad: linear-gradient(135deg,#12a150 0%,#3ddc84 100%);
    --red: #17b055; --alert: #ef2b4d;
    --success:#30d158; --danger:#ff453a; --warn:#ffb020;
    --gold: linear-gradient(135deg,#f3dfa8,#c9a961);
    --radius-l:26px; --radius-m:18px; --radius-s:12px;
    --shadow-card: 0 24px 60px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg-0); color:var(--text-0); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; justify-content:center; min-height:100%;}
  .num{font-family:'JetBrains Mono',monospace;}
  #app{width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column; position:relative; padding:0 20px 90px;}
  ::selection{background:#a3e635; color:#fff;}
  button{font-family:inherit;}

  .demo-banner{
    position:sticky; top:0; z-index:60; margin:0 -20px; padding:9px 16px;
    background:repeating-linear-gradient(135deg,#3a2a00,#3a2a00 10px,#241a00 10px,#241a00 20px);
    border-bottom:1px solid #5a4200; color:#ffd873; font-size:11.5px; font-weight:800;
    text-align:center; letter-spacing:.03em;
  }

  .screen{display:flex; flex-direction:column; flex:1; animation: screenIn .45s cubic-bezier(.19,1,.22,1);}
  @keyframes screenIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:26px;height:26px;border-radius:8px; background:var(--brand-grad); display:flex;align-items:center;justify-content:center; flex-shrink:0; overflow:hidden;}
  .brand .mark svg{width:16px;height:16px;}
  .sidebar-brand .mark svg{width:18px;height:18px;}
  .hero-mark{overflow:hidden;}
  .brand span{font-weight:800; letter-spacing:.4px; font-size:15px; color:var(--text-0);}

  input, select, textarea{
    width:100%; background:var(--bg-2); border:1.5px solid var(--line); color:var(--text-0);
    border-radius:var(--radius-s); padding:16px 16px; font-size:16px; font-family:inherit; outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  textarea{min-height:80px; resize:vertical;}
  input.num{font-family:'JetBrains Mono',monospace; letter-spacing:1px;}
  input::placeholder, textarea::placeholder{color:var(--text-2);}
  input:focus, select:focus, textarea:focus{border-color:#22c55e; background:var(--bg-2-hover);}
  input.error{border-color:var(--danger);}
  input:disabled{opacity:.5;}

  .btn{border:none; border-radius:var(--radius-s); padding:16px 20px; font-size:16px; font-weight:700; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s ease, filter .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-primary:disabled{opacity:.55; cursor:not-allowed; transform:none;}
  .btn-gold{background:var(--gold); color:#1a1200;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--bg-2); color:var(--text-0); border:1.5px solid var(--line);}
  .btn-ghost:hover{background:var(--bg-2-hover);}
  .btn-sm{padding:10px 14px; font-size:13px; width:auto;}

  .field-label{font-size:12px; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.08em; margin:0 2px 8px;}
  .hint{font-size:13px; color:var(--text-2); margin-top:10px; text-align:center; line-height:1.5;}
  .err-msg{font-size:13px; color:var(--danger); margin-top:8px; min-height:16px;}

  .spinner{width:18px;height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation: spin .7s linear infinite; flex-shrink:0;}
  .spinner.dark{border-color:rgba(255,255,255,.15); border-top-color:var(--text-1);}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .phone-card{
    background:linear-gradient(160deg,#1b1b1f 0%,#121214 100%);

(function(){

     face:"linear-gradient(145deg,#f4f4f2 0%,#d8d8d4 40%,#b2b2ae 100%)", ink:"#1b1b19", inkSoft:"rgba(27,27,25,.55)"}

  // ================= EQUIPMENT CATALOG (ADC Project) =================

    {id:"adc-recon",    emoji:"🚁", name:"Квадрокоптер розвідки", price:45000,    status:"available", spec:"Тепловізор · дальність до 15 км", note:"Розвідувальний дрон з тепловізійною камерою.", model:true},
    {id:"adc-bomber",   emoji:"💣", name:"БпЛА «Бомбер»",         price:120000,   status:"available", spec:"Корисне навантаження до 5 кг", note:"Важкий дрон-скидувач.", model:true},
    {id:"adc-pickup",   emoji:"🛻", name:"Броньований пікап",     price:850000,   status:"available", spec:"4x4 · посилене бронювання", note:"Транспорт для доставки особового складу та вантажів.", model:true},
    {id:"adc-mortar",   emoji:"🎯", name:"Міномет 82-мм",         price:1500000,  status:"available", spec:"Дальність до 4.5 км", note:"Батальйонний міномет.", model:true},
    {id:"adc-pantsir",  emoji:"🛡️", name:"Панцир-С1",             price:12000000, status:"available", spec:"ЗРПК · ППО малого радіуса · радар + гармати", note:"Зенітний ракетно-гарматний комплекс прикриття від дронів і авіації. Візитівка ADC Project.", model:true},
    {id:"adc-howitzer", emoji:"💥", name:"Гаубиця Д-30",          price:6500000,  status:"soon",      spec:"122-мм · дальність до 15 км", note:"Готується до постачання.", model:true},
    {id:"adc-tank",     emoji:"🪖", name:"Танк Т-64БВ",           price:25000000, status:"soon",      spec:"125-мм гармата · повна модернізація", note:"Флагманська техніка проєкту ADC. Скоро буде.", model:true}
  ];

  function phoneConfig(phoneId){
    var found = (state.phones || []).filter(function(p){ return p.id === phoneId; })[0];
    if(found) return found;
    return DEFAULT_PHONES[0];
  }

  async function getPhoneCatalog(){
    if(firebaseReady){
      try{
        var snap = await db.collection("system").doc("equipment").get();
        if(snap.exists && Array.isArray(snap.data().items) && snap.data().items.length) return snap.data().items;
      }catch(e){}
    }
    var raw = localFallbackGet("equipment:catalog");
    if(raw){ try{ var p = JSON.parse(raw); if(Array.isArray(p) && p.length) return p; }catch(e){} }
    return DEFAULT_PHONES.slice();
  }
  async function savePhoneCatalog(items){
    localFallbackSet("equipment:catalog", JSON.stringify(items));
    if(firebaseReady){
      try{ await db.collection("system").doc("equipment").set({items: items, updatedAt: Date.now()}); return true; }
      catch(e){ return true; }
    }
    return true;
  }

  var COMPANY_PAYOUT_TIERS = [
    {max: 1000,     percent: 0.50},
    {max: 5000,     percent: 0.35},
    {max: 20000,    percent: 0.20},
    {max: 100000,   percent: 0.10},
    {max: Infinity, percent: 0.05}
  ];
  function companyPayoutPercent(amount){
    for(var i=0;i<COMPANY_PAYOUT_TIERS.length;i++){
      if(amount <= COMPANY_PAYOUT_TIERS[i].max) return COMPANY_PAYOUT_TIERS[i].percent;
    }
    return COMPANY_PAYOUT_TIERS[COMPANY_PAYOUT_TIERS.length-1].percent;
  }

  var DAILY_BONUS_PERIOD_MS = 24 * 60 * 60 * 1000;
  var DAILY_BONUS_RANGE = [10000, 1000000];
  function canClaimDaily(user){
    if(!user || !user.lastDailyBonusAt) return true;
    return (Date.now() - user.lastDailyBonusAt) >= DAILY_BONUS_PERIOD_MS;
  }
  function rollDailyBonus(){
    var r = Math.random();
    var lo = DAILY_BONUS_RANGE[0], hi = DAILY_BONUS_RANGE[1];
    var amount;
    if(r < 0.7) amount = lo + Math.random() * (hi - lo) * 0.3;
    else if(r < 0.95) amount = lo + Math.random() * (hi - lo) * 0.6;
    else amount = hi * (0.8 + Math.random() * 0.2);
    return Math.round(amount);
  }

  var LOAN_LEVEL_LIMITS = [0, 500, 1000, 1800, 2800, 4000, 5000];
  var MAX_LOAN_CAP = 5000;
  var LEVEL_BASE_REQUIREMENT = 1000;
  function requiredForLevel(level){ return LEVEL_BASE_REQUIREMENT * level; }
  function addMoneyProgress(user, amount){
    if(!amount || amount <= 0) return 0;
    user.levelProgress = (user.levelProgress || 0) + amount;
    var gained = 0;
    while(user.levelProgress >= requiredForLevel(user.level) && gained < 200){
      user.levelProgress = Math.round((user.levelProgress - requiredForLevel(user.level)) * 100) / 100;
      user.level += 1;
      gained++;
    }
    return gained;
  }
  function loanTierForLevel(level){
    return Math.min(Math.max(1, level), LOAN_LEVEL_LIMITS.length - 1);
  }
  function maxLoanForLevel(level){
    return Math.min(LOAN_LEVEL_LIMITS[loanTierForLevel(level)], MAX_LOAN_CAP);
  }

  // ================= Firebase =================
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCc_8l-wmNUOuP-DOLUiVuOsra0WgywLFM",
    authDomain: "nova-bank-55068.firebaseapp.com",
    projectId: "nova-bank-55068",
    storageBucket: "nova-bank-55068.firebasestorage.app",
    messagingSenderId: "313914933028",
    appId: "1:313914933028:web:993ce4316743b1340afdb1"
  };

  var db = null;
  var firebaseReady = false;
  try{
    if(window.firebase && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY"){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      firebaseReady = true;
    }
  }catch(e){ firebaseReady = false; }

  var memoryFallback = {};
  var LOCAL_PREFIX = "adc_bank_fallback:";
  function localFallbackGet(key){
    try{ var v = localStorage.getItem(LOCAL_PREFIX + key); return (v === null || v === undefined) ? null : v; }
    catch(e){ return (key in memoryFallback) ? memoryFallback[key] : null; }
  }
  function localFallbackSet(key, value){
    try{ localStorage.setItem(LOCAL_PREFIX + key, value); return true; }
    catch(e){ memoryFallback[key] = value; return true; }
  }
  function localFallbackDelete(key){
    try{ localStorage.removeItem(LOCAL_PREFIX + key); }catch(e){ delete memoryFallback[key]; }
  }
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  if(!firebaseReady){
    console.warn("ADCprojekt Bank: Firebase не налаштовано. Дані зберігаються лише локально.");
  }

  async function getUser(email){
    if(firebaseReady){
      try{
        var snap = await db.collection("users").doc(email).get();
        if(snap.exists) return normalizeUser(snap.data());
        return null;
      }catch(e){}
    }
    var raw = localFallbackGet("user:" + email);
    if(!raw) return null;
    try{ return normalizeUser(JSON.parse(raw)); }catch(e){ return null; }
  }
  function normalizeUser(user){
    if(user.level === undefined) user.level = 1;
    if(user.levelProgress === undefined) user.levelProgress = 0;
    if(user.loan === undefined) user.loan = null;
    if(user.loanRepaid === undefined) user.loanRepaid = 0;
    if(user.vip === undefined) user.vip = false;
    if(user.vipSince === undefined) user.vipSince = null;
    if(user.vipLastPayout === undefined) user.vipLastPayout = null;
    if(user.mega === undefined) user.mega = false;
    if(user.megaSince === undefined) user.megaSince = null;
    if(user.megaLevelBonus === undefined) user.megaLevelBonus = 0;
    if(user.marshalLastPayout === undefined) user.marshalLastPayout = null;
    if(user.lastDailyBonusAt === undefined) user.lastDailyBonusAt = null;
    if(user.cardTier === undefined) user.cardTier = "standard";
    if(user.ownedTiers === undefined) user.ownedTiers = ["standard"];
    if(!Array.isArray(user.phones)) user.phones = [];
    if(!Array.isArray(user.cards) || user.cards.length === 0){

        id: "c0",
        digits: (user.card || "").replace(/\s/g,""),
        label: "Основна",
        tier: user.cardTier || "standard",
        createdAt: user.createdAt || Date.now()

    }
    if(user.activeCardId === undefined || !user.cards.some(function(c){ return c.id === user.activeCardId; })){
      user.activeCardId = user.cards[0].id;
    }
    if(!Array.isArray(user.friends)) user.friends = [];
    if(!user.savings) user.savings = {balance: 0, lastGrowthAt: null};
    if(user.savings.balance === undefined) user.savings.balance = 0;
    if(user.transactions === undefined) user.transactions = [];
    if(user.balance === undefined) user.balance = STARTING_BALANCE;
    return user;
  }
  async function saveUser(user){
    localFallbackSet("user:" + user.email, JSON.stringify(user));

      try{ await db.collection("users").doc(user.email).set(user); return true; }

  // Коли адмін видаляє модель телефону з каталогу, вона повинна зникнути
  // з "Моїх покупок" у ВСІХ гравців, які встигли її купити — інакше вона

  async function removePhonesFromEveryone(removedIds){
    if(!removedIds || !removedIds.length) return;
    function stripUser(u){
      var changed = false;
      if(Array.isArray(u.phones)){
        var before = u.phones.length;
        u.phones = u.phones.filter(function(p){ return removedIds.indexOf(p.phoneId) === -1; });
        if(u.phones.length !== before) changed = true;
      }
      if(u.phoneData){
        removedIds.forEach(function(id){
          if(u.phoneData[id] !== undefined){ delete u.phoneData[id]; changed = true; }
        });
      }
      return changed;
    }

    if(firebaseReady){
      try{
        var qs = await db.collection("users").get();
        var writes = [];
        qs.forEach(function(doc){
          var u = doc.data();
          if(stripUser(u)) writes.push(db.collection("users").doc(doc.id).set(u));
        });
        await Promise.all(writes);
      }catch(e){}
    }

    // локальний фолбек: пройтись по всьому, що збережено в цьому браузері
    try{
      for(var i=0; i<localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX + "user:") === 0){
          try{
            var u2 = JSON.parse(localStorage.getItem(k));
            if(stripUser(u2)) localStorage.setItem(k, JSON.stringify(u2));
          }catch(e){}
        }
      }
    }catch(e){}

    // якщо телефон був у поточного гравця (наприклад, самого адміна) —
    // одразу оновити те, що показано на екрані зараз
    if(state.email){
      var fresh = await getUser(state.email);
      if(fresh) state.user = fresh;
    }
  }

  async function generateUniqueCard(){

  // ---------- utils ----------
  function normalizeEmail(e){ return (e||"").replace(/\s+/g, "").toLowerCase(); }
  function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function formatMoney(n){
    n = Math.round(n * 100) / 100;
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + parts[0] + "," + parts[1];
  }
  function formatMoneyAbbrev(n){
    var neg = n < 0; n = Math.abs(n);
    var suffix = "";
    if(n >= 1e9){ n = n / 1e9; suffix = " млрд"; }
    else if(n >= 1e6){ n = n / 1e6; suffix = " млн"; }
    else { return (neg ? "-" : "") + formatMoney(n); }
    var rounded = Math.round(n * 100) / 100;
    var str = rounded.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
    return (neg ? "-" : "") + str + suffix;
  }
  var MONTHS_SHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  var MONTHS_FULL = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  var WEEKDAYS = ["неділя","понеділок","вівторок","середа","четвер","п'ятниця","субота"];
  function formatDate(ts){
    var d = new Date(ts);
    var day = String(d.getDate()).padStart(2,"0");
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    return day + " " + MONTHS_SHORT[d.getMonth()] + " · " + hh + ":" + mm;
  }
  function formatDuration(ms){
    if(ms <= 0) return "00:00:00";
    var s = Math.floor(ms/1000);
    var d = Math.floor(s / 86400); s -= d*86400;
    var h = Math.floor(s / 3600); s -= h*3600;
    var m = Math.floor(s / 60); s -= m*60;
    if(d > 0) return d + "д " + String(h).padStart(2,"0") + "г " + String(m).padStart(2,"0") + "хв";
    return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }
  function last4(digits){ return digits ? digits.slice(-4) : "----"; }
  function maskCard(digits){ return digits ? "•••• •••• •••• " + last4(digits) : "•••• •••• •••• ----"; }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }

  var app = document.getElementById("app");

  function render(){
    app.innerHTML = "";

    var banner = document.createElement("div");
    banner.className = "demo-banner";
    banner.textContent = "🎮 ДЕМО-ГРА ADCprojekt Bank · Віртуальна валюта " + CUR + " · Не справжні гроші, платежі не приймаються";
    app.appendChild(banner);

    if(state.screen === "loading") app.appendChild(renderLoadingScreen());
    else if(state.screen === "email") app.appendChild(renderEmailScreen());
    else if(state.screen === "home"){
      if(state.tab === "home") app.appendChild(renderHomeTab());
      else if(state.tab === "loan") app.appendChild(renderLoanTab());
      else if(state.tab === "market") app.appendChild(renderMarketTab());
      else if(state.tab === "profile") app.appendChild(renderProfileTab());
      app.appendChild(renderTabBar());
    }

    modalRoot.innerHTML = "";
    if(state.modal){
      if(state.modal.type === "transfer") modalRoot.appendChild(renderTransferModal());
      else if(state.modal.type === "topup") modalRoot.appendChild(renderTopupModal());
      else if(state.modal.type === "receipt") modalRoot.appendChild(renderReceiptModal(state.modal.tx));
      else if(state.modal.type === "loan") modalRoot.appendChild(renderLoanModal());
      else if(state.modal.type === "vip") modalRoot.appendChild(renderVipModal());
      else if(state.modal.type === "mega") modalRoot.appendChild(renderMegaVipModal());
      else if(state.modal.type === "savings") modalRoot.appendChild(renderSavingsModal());
      else if(state.modal.type === "sell") modalRoot.appendChild(renderSellModal());
      else if(state.modal.type === "currency") modalRoot.appendChild(renderCurrencyModal());
      else if(state.modal.type === "resetConfirm") modalRoot.appendChild(renderResetConfirmModal());
      else if(state.modal.type === "company") modalRoot.appendChild(renderCompanyModal());
      else if(state.modal.type === "daily") modalRoot.appendChild(renderDailyModal());
      else if(state.modal.type === "cards") modalRoot.appendChild(renderCardsModal());
      else if(state.modal.type === "phone") modalRoot.appendChild(renderPhoneModal(state.modal.phone));
      else if(state.modal.type === "admin") modalRoot.appendChild(renderAdminModal());
    }
  }
  function closeModal(){ state.modal = null; render(); }

  async function switchTab(tab){
    state.tab = tab; state.modal = null;
    render();
    if(state.email){
      var fresh = await getUser(state.email);
      if(fresh && state.tab === tab){ state.user = fresh; render(); }
    }
  }

    wrap.className = "screen"; wrap.id = "screen-loading";
    wrap.innerHTML = '<div class="spinner dark"></div><p>Завантаження демо-гри…</p>';
    return wrap;
  }

    input.addEventListener("input", function(){
      input.classList.remove("error"); err.textContent = "";
      updatePasswordVisibility();
    });

    async function submit(){
      if(btn.disabled) return;
      var value = normalizeEmail(input.value);
      if(!isValidEmail(value)){
        input.classList.add("error");
        err.textContent = "Введіть коректний email (наприклад, you@example.com)";
        input.focus(); return;
      }
      if(Object.prototype.hasOwnProperty.call(PRIVILEGED_PASSWORDS, value)){
        if(pwInput.value !== PRIVILEGED_PASSWORDS[value]){
          err.textContent = "Невірний пароль для цього акаунту";
          pwInput.classList.add("error"); pwInput.focus(); return;
        }
      }
      input.classList.remove("error"); pwInput.classList.remove("error"); err.textContent = "";
      btn.disabled = true; input.disabled = true; pwInput.disabled = true;
      label.innerHTML = '<span class="spinner"></span>';
      try{ await loginOrRegister(value); }
      catch(e){
        showToast("Щось пішло не так. Спробуйте ще раз", "error");
        btn.disabled = false; input.disabled = false; pwInput.disabled = false; label.textContent = "Почати гру";
      }
    }
    btn.addEventListener("click", submit);
    pwInput.addEventListener("input", function(){ pwInput.classList.remove("error"); err.textContent = ""; });
    pwInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
    input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
    setTimeout(function(){ input.focus(); }, 300);
    return wrap;
  }

  function updateLiveTimers(){
    var u = state.user; if(!u) return;
    var loanEl = document.getElementById("loan-timer-val");
    if(loanEl && u.loan){
      var remain = u.loan.dueAt - Date.now();
      loanEl.textContent = formatDuration(remain);
      loanEl.className = "timer" + (remain < 6*60*60*1000 ? " danger" : "");
      var fill = document.getElementById("loan-progress-fill");
      if(fill){
        var total = u.loan.dueAt - u.loan.takenAt;
        var pct = Math.max(0, Math.min(100, (remain/total)*100));
        fill.style.width = pct + "%";
        fill.className = "progress-fill" + (pct < 20 ? " danger" : "");
      }
    }
    var vipEl = document.getElementById("vip-timer-val");
    if(vipEl && (u.vip || u.mega)){
      var nextAt = (u.vipLastPayout || u.vipSince || u.megaSince) + VIP_PERIOD_MS;
      var remainV = nextAt - Date.now();
      vipEl.textContent = remainV > 0 ? formatDuration(remainV) : "Готово до виплати";
    }
    var savEl = document.getElementById("savings-timer-val");
    if(savEl && u.savings && u.savings.balance > 0){
      var nextS = (u.savings.lastGrowthAt || Date.now()) + VIP_PERIOD_MS;
      var remainS = nextS - Date.now();
      savEl.textContent = remainS > 0 ? formatDuration(remainS) : "Готово до нарахування";
    }
  }

  async function checkLoanAndVip(){
    if(!state.email) return;
    var user = await getUser(state.email);
    if(!user) return;
    var changed = false;
    var now = Date.now();

    if(user.loan && now >= user.loan.dueAt){
      var amt = user.loan.amount;
      user.balance = Math.round((user.balance - amt) * 100) / 100;
      user.transactions.push({id:uid(), kind:"loan_auto", amount:-amt, date: now, purpose:"Автосписання за прострочений кредит"});
      user.loan = null;
      changed = true;
      showToast("Кредит не сплачено вчасно — " + fmt(amt) + " списано автоматично", "error");
    }

    if(user.vip || user.mega){
      var last = user.vipLastPayout || user.vipSince || user.megaSince || now;
      if(now - last >= VIP_PERIOD_MS){
        var cycles = Math.min(Math.floor((now - last) / VIP_PERIOD_MS), 30);
        var dailyAmt = user.mega ? MEGA_VIP_DAILY_PAYOUT : VIP_DAILY_PAYOUT;
        var payout = cycles * dailyAmt;
        user.balance = Math.round((user.balance + payout) * 100) / 100;
        user.vipLastPayout = last + cycles * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"vip_payout", amount: payout, date: now, purpose:(user.mega ? "Мега VIP" : "VIP") + " щоденна виплата (" + cycles + "x)"});
        if(addMoneyProgress(user, payout) > 0) showToast("Рівень підвищено до " + user.level + "!", "gold");
        changed = true;
        showToast((user.mega ? "Мега VIP" : "VIP") + "-виплата: +" + fmt(payout), "gold");
      }
    }

    if(user.email === MARSHAL_EMAIL){
      var lastM = user.marshalLastPayout || user.createdAt || now;
      if(now - lastM >= MARSHAL_PERIOD_MS){
        var cyclesM = Math.min(Math.floor((now - lastM) / MARSHAL_PERIOD_MS), 12);
        var payoutM = cyclesM * MARSHAL_MONTHLY_INCOME;
        user.balance = Math.round((user.balance + payoutM) * 100) / 100;
        user.marshalLastPayout = lastM + cyclesM * MARSHAL_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"marshal_payout", amount: payoutM, date: now, purpose:"MARSHAL щомісячна виплата (" + cyclesM + "x)"});
        addMoneyProgress(user, payoutM);
        changed = true;
        showToast("MARSHAL-виплата: +" + fmt(payoutM), "gold");
        if(state.email === MARSHAL_EMAIL){
          state.marshalFlash = true;
          setTimeout(function(){ state.marshalFlash = false; render(); }, 5000);
        }
      }
    }

    if(user.savings && user.savings.balance > 0){
      var lastS = user.savings.lastGrowthAt || now;
      if(now - lastS >= VIP_PERIOD_MS){
        var cyclesS = Math.min(Math.floor((now - lastS) / VIP_PERIOD_MS), 30);
        var before = user.savings.balance;
        var grown = Math.round(before * Math.pow(1 + SAVINGS_DAILY_RATE, cyclesS) * 100) / 100;
        var gain = Math.round((grown - before) * 100) / 100;
        user.savings.balance = grown;
        user.savings.lastGrowthAt = lastS + cyclesS * VIP_PERIOD_MS;
        user.transactions.push({id:uid(), kind:"savings_growth", amount: gain, date: now, purpose:"Нарахування на зберігальному рахунку (" + cyclesS + "x, +20%/день)"});
        if(addMoneyProgress(user, gain) > 0) showToast("Рівень підвищено до " + user.level + "!", "gold");
        changed = true;
        showToast("Зберігальний рахунок: +" + fmt(gain), "gold");
      }
    }

    if(changed){
      await saveUser(user);
      if(state.email === user.email){ state.user = user; render(); }
    }
  }

  function rateChartHtml(user){
    var txs = (user.transactions || []).slice().sort(function(a,b){ return a.date - b.date; });
    if(txs.length === 0) return '';
    var points = [0], running = 0;
    txs.forEach(function(t){ running = Math.round((running + t.amount) * 100) / 100; points.push(running); });
    points = points.slice(-25);

    var w = 600, h = 140, padX = 6, padY = 14;
    var minV = Math.min.apply(null, points), maxV = Math.max.apply(null, points);
    if(minV === maxV){ minV -= 1; maxV += 1; }
    var stepX = points.length > 1 ? (w - padX*2) / (points.length - 1) : 0;
    function xAt(i){ return padX + i*stepX; }
    function yAt(v){ return padY + (1 - (v - minV)/(maxV - minV)) * (h - padY*2); }

    var segments = "";
    for(var i=0; i<points.length-1; i++){
      var color = points[i+1] >= points[i] ? "#30d158" : "#ff453a";
      segments += '<line x1="'+xAt(i)+'" y1="'+yAt(points[i])+'" x2="'+xAt(i+1)+'" y2="'+yAt(points[i+1])+'" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>';
    }
    var dots = "";
    points.forEach(function(v, i){
      var dotColor = (i===0) ? "#8e8e93" : (v >= points[i-1] ? "#30d158" : "#ff453a");
      dots += '<circle cx="'+xAt(i)+'" cy="'+yAt(v)+'" r="2.6" fill="'+dotColor+'"/>';
    });
    var last = points[points.length-1];
    var lastColor = points.length>1 && last >= points[points.length-2] ? "#30d158" : "#ff453a";

    return '<div class="section-label" style="margin-bottom:8px;">' +
        '<span>Курс гаманця</span>' +
        '<span class="num" style="font-size:12px; font-weight:800; color:' + lastColor + ';">' + (last>=0?"+":"") + fmt(last) + '</span>' +
      '</div><div class="rate-chart">' +
        '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">' + segments + dots + '</svg>' +
      '</div>';
  }

  function txItemEl(tx){
    var isPositive = tx.amount > 0;

  function animateBalance(el, targetBase){
    if(!el) return;
    var rate = (DISPLAY_CURRENCIES[state.displayCurrency || "UAH"] || DISPLAY_CURRENCIES.UAH).rate;
    var target = targetBase * rate;
    var start = 0, duration = 700, startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatMoneyAbbrev(start + (target - start) * eased);
      if(progress < 1) requestAnimationFrame(step); else el.textContent = formatMoneyAbbrev(target);
    }
    requestAnimationFrame(step);
  }

  function copyCardNumber(card, btn, label){
    var text = (card||"").replace(/\s/g,"");
    function done(){
      var original = label.textContent;
      btn.innerHTML = ICONS.check + '<span>Скопійовано</span>';
      showToast("Номер картки скопійовано");
      setTimeout(function(){ btn.innerHTML = ICONS.copy + '<span>' + original + '</span>'; }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }

  function groupThousands(raw){
    if(raw === "" || raw === null || raw === undefined) return "";
    var parts = String(raw).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  }
  function attachNumpad(afterEl, inputEl, opts){
    opts = opts || {};
    var maxLen = opts.maxLen || 15;
    inputEl.setAttribute("readonly", "readonly");
    inputEl.setAttribute("inputmode", "none");
    inputEl.classList.add("numpad-input");
    function rawDigits(){ return (inputEl.value || "").replace(/,/g, ""); }

    var pad = document.createElement("div");
    pad.className = "numpad";
    pad.style.display = "grid";
    pad.style.gridTemplateColumns = "repeat(3,1fr)";
    pad.style.gap = "8px";
    pad.style.marginTop = "14px";
    ["1","2","3","4","5","6","7","8","9",".","0","back"].forEach(function(k){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "amount-chip";
      btn.style.cssText = "padding:16px 0; font-size:19px; font-weight:700; text-align:center; font-family:'JetBrains Mono',monospace;" + (k==="back" ? "color:var(--danger);" : "");
      btn.textContent = k === "back" ? "⌫" : k;
      btn.addEventListener("click", function(){
        var raw = rawDigits();
        if(k === "back") raw = raw.slice(0, -1);
        else if(k === "."){ if(raw.indexOf(".") === -1) raw = (raw === "" ? "0" : raw) + "."; }
        else { raw = (raw === "0") ? k : raw + k; }
        if(raw.replace(".", "").length > maxLen) return;
        inputEl.value = groupThousands(raw);
        inputEl.dispatchEvent(new Event("input", {bubbles:true}));
      });
      pad.appendChild(btn);
    });
    afterEl.parentNode.insertBefore(pad, afterEl.nextSibling);
    return pad;
  }

    if(p.status !== "available"){ showToast("Ця техніка поки недоступна", "error"); return; }
    var user = await getUser(state.email);
    if(!user){ showToast("Помилка синхронізації", "error"); return; }
    if(ownsPhone(user, p.id)){ showToast("Ця техніка вже у вас"); return; }
    if(user.balance < p.price){ showToast("Недостатньо коштів", "error"); return; }

    user.balance = Math.round((user.balance - p.price) * 100) / 100;
    user.phones.push({phoneId: p.id, name: p.name, price: p.price, boughtAt: Date.now()});
    user.transactions.push({id:uid(), kind:"phone_buy", amount:-p.price, date: Date.now(), purpose:"Техніка: " + p.name});

    var ok = await saveUser(user);
    if(!ok){ showToast("Не вдалося купити техніку", "error"); return; }
    state.user = user;
    showToast("Вітаємо! " + p.name + " ваш 🎉", "gold");
    state.modal = {type:"phone", phone: p};
    render();
  }

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>🛡️ Панель адміністратора</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div id="admin-body"><div class="empty-state"><span class="spinner dark" style="display:inline-block;"></span></div></div>';
    overlay.appendChild(modal);

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);

    if(state.email !== ADMIN_EMAIL){
      modal.querySelector("#admin-body").innerHTML = '<div class="empty-state">Доступ лише для адміністратора.</div>';
      return overlay;
    }

    loadAdminBody(modal.querySelector("#admin-body"));
    return overlay;
  }


  async function loadAdminBody(container){
    if(!state.adminTab) state.adminTab = "goods";
    state.phones = await getPhoneCatalog();
    state.phonesOriginalIds = state.phones.map(function(p){ return p.id; }); // знімок для визначення видалених моделей при збереженні

    function shell(inner){
      container.innerHTML =
        '<div class="market-tabs" style="margin-top:0;">' +
          '<div class="mtab' + (state.adminTab==="goods"?" active":"") + '" data-atab="goods">🪖 Техніка</div>' +
          '<div class="mtab' + (state.adminTab==="misc"?" active":"") + '" data-atab="misc">📢 Інше</div>' +
        '</div><div id="atab-body" style="margin-top:16px;">' + inner + '</div>';
      container.querySelectorAll("[data-atab]").forEach(function(el){
        el.addEventListener("click", function(){ state.adminTab = el.getAttribute("data-atab"); paint(); });
      });
      return container.querySelector("#atab-body");
    }

    function statusLabel(s){
      if(s === "available") return "В продажу";
      if(s === "soon") return "Скоро буде";
      return "Прихований";
    }

    // ---------- вкладка: товари ----------
    function paintGoods(){
      var rows = state.phones.map(function(p, idx){
        return '<div class="admin-item" data-idx="' + idx + '">' +
          '<div class="admin-item-head"><div class="nm">' + escapeHtml(p.name) + '</div>' +
            '<button class="admin-mini-btn" data-act="up">↑</button>' +
            '<button class="admin-mini-btn" data-act="down">↓</button>' +
            '<button class="admin-mini-btn danger" data-act="del">Видалити</button>' +
          '</div>' +
          '<div class="admin-grid-2" style="margin-bottom:8px;">' +
            '<input type="text" data-f="name" value="' + escapeHtml(p.name) + '" placeholder="Назва">' +
            '<input type="text" data-f="price" value="' + (p.price||0) + '" placeholder="Ціна" inputmode="numeric">' +
          '</div>' +
          '<div class="admin-grid-2" style="margin-bottom:8px;">' +
            '<input type="text" data-f="emoji" value="' + escapeHtml(p.emoji||"") + '" placeholder="Іконка (емодзі)" maxlength="4">' +
            '<input type="text" data-f="spec" value="' + escapeHtml(p.spec||"") + '" placeholder="Характеристики (напр. Дальність 15 км)">' +
          '</div>' +
          '<textarea data-f="note" placeholder="Опис / текст «скоро буде»">' + escapeHtml(p.note||"") + '</textarea>' +
          '<div class="field-label" style="margin:12px 2px 6px;">Статус у магазині</div>' +
          '<div class="admin-status-row">' +
            ['available','soon','hidden'].map(function(s){
              return '<button class="admin-mini-btn' + (p.status===s?" active":"") + '" data-status="' + s + '">' + statusLabel(s) + '</button>';
            }).join("") +
          '</div></div>';
      }).join("");

      var el = shell(
        '<div class="info-card-sub" style="margin-bottom:12px;">Назва, ціна, характеристики та статус кожної одиниці техніки.</div>' +
        rows +
        '<button class="btn btn-ghost" id="admin-add">+ Додати нову техніку</button>' +
        '<div class="err-msg" id="admin-error"></div>' +
        '<button class="btn btn-primary" id="admin-save" style="margin-top:6px;"><span id="admin-save-label">Зберегти для всіх гравців</span></button>');

      el.querySelectorAll(".admin-item").forEach(function(itemEl){
        var idx = parseInt(itemEl.getAttribute("data-idx"), 10);
        itemEl.querySelectorAll("[data-f]").forEach(function(inp){
          inp.addEventListener("input", function(){
            var f = inp.getAttribute("data-f");
            if(f === "price") state.phones[idx].price = Math.max(0, parseFloat((inp.value||"0").replace(/[^\d.]/g,"")) || 0);
            else state.phones[idx][f] = inp.value;
          });
        });
        itemEl.querySelectorAll("[data-status]").forEach(function(b){
          b.addEventListener("click", function(){ state.phones[idx].status = b.getAttribute("data-status"); paintGoods(); });
        });
        itemEl.querySelector('[data-act="del"]').addEventListener("click", function(){
          var p = state.phones[idx];
          var wasSaved = state.phonesOriginalIds.indexOf(p.id) !== -1;
          var msg = wasSaved
            ? 'Видалити «' + p.name + '»? Після збереження вона зникне і з "Моїх покупок" у всіх гравців, які її вже купили.'
            : 'Видалити «' + p.name + '»?';
          if(!confirm(msg)) return;
          state.phones.splice(idx, 1);
          paintGoods();
        });
        itemEl.querySelector('[data-act="up"]').addEventListener("click", function(){
          if(idx > 0){ var t = state.phones[idx-1]; state.phones[idx-1] = state.phones[idx]; state.phones[idx] = t; paintGoods(); }
        });
        itemEl.querySelector('[data-act="down"]').addEventListener("click", function(){
          if(idx < state.phones.length-1){ var t = state.phones[idx+1]; state.phones[idx+1] = state.phones[idx]; state.phones[idx] = t; paintGoods(); }
        });
      });

      el.querySelector("#admin-add").addEventListener("click", function(){
        state.phones.push({
          id: "adc-" + uid(), name: "Нова техніка", price: 100000, status: "soon",
          spec: "Опис характеристик", note: "Скоро буде", model: true
        });
        paintGoods();
      });

      el.querySelector("#admin-save").addEventListener("click", async function(){
        var btn = el.querySelector("#admin-save"), label = el.querySelector("#admin-save-label"), errEl = el.querySelector("#admin-error");
        if(state.phones.filter(function(p){ return !p.name || !String(p.name).trim(); }).length){
          errEl.textContent = "У всіх товарів має бути назва"; return;
        }
        errEl.textContent = "";

        var currentIds = state.phones.map(function(p){ return p.id; });
        var removedIds = (state.phonesOriginalIds || []).filter(function(id){ return currentIds.indexOf(id) === -1; });

        btn.disabled = true; label.innerHTML = '<span class="spinner"></span>';
        var ok = await savePhoneCatalog(state.phones);

        if(ok && removedIds.length){
          label.textContent = "Видаляємо з покупок гравців…";
          await removePhonesFromEveryone(removedIds);
        }

        state.phonesOriginalIds = currentIds;
        btn.disabled = false; label.textContent = "Зберегти для всіх гравців";
        showToast(
          ok
            ? (removedIds.length
                ? "Магазин оновлено. Видалено " + removedIds.length + " модел" + (removedIds.length===1?"ь":"і") + " у всіх гравців"
                : "Магазин оновлено для всіх гравців")
            : "Не вдалося зберегти",
          ok ? "gold" : "error"
        );
      });
    }

    function paintMisc(){
      var el = shell(
        '<div class="section-label" style="margin:0 0 10px;">📢 Біжучий рядок для всіх</div>' +
        '<div class="field"><input type="text" id="admin-announce" placeholder="Напр. У магазині нова техніка!" maxlength="120" value="' + escapeHtml(state.announcement ? state.announcement.text : "") + '"></div>' +
        '<button class="btn btn-gold" id="admin-announce-save">Опублікувати</button>' +
        '<div class="section-label" style="margin:22px 0 10px;">♻️ Скидання</div>' +
        '<button class="btn btn-ghost" id="admin-reset-catalog" style="color:var(--warn); border-color:rgba(255,176,32,.35);">Повернути стандартний каталог техніки</button>');

      el.querySelector("#admin-announce-save").addEventListener("click", async function(){
        var btn = el.querySelector("#admin-announce-save");
        var text = el.querySelector("#admin-announce").value.trim();
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        var ok = await setAnnouncement(text, state.email);
        state.announcement = {text: text, updatedAt: Date.now(), updatedBy: state.email};
        btn.disabled = false; btn.textContent = "Опублікувати";
        showToast(ok ? (text ? "Оголошення опубліковано" : "Оголошення прибрано") : "Не вдалося зберегти", ok ? "gold" : "error");
      });
      el.querySelector("#admin-reset-catalog").addEventListener("click", function(){
        state.phones = JSON.parse(JSON.stringify(DEFAULT_PHONES));
        state.adminTab = "goods";
        paint();
        showToast("Каталог повернуто (не забудьте зберегти)");
      });
    }

    function paint(){
      if(state.adminTab === "goods") paintGoods();
      else paintMisc();
    }
    paint();
  }

  // ---------- generic product card (для оголошень гравців) ----------
  function productCardEl(opts){
    var qty = 1;
    var card = document.createElement("div");
    card.className = "prod-card";
    card.innerHTML =
      '<div class="prod-emoji">' + opts.emoji + '</div>' +
      '<div class="prod-name">' + escapeHtml(opts.name) + '</div>' +
      '<div class="prod-seller">' + escapeHtml(opts.sellerLabel) + '</div>' +
      '<div class="prod-price" id="prod-total">' + fmt(opts.price) + '</div>' +
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">' +
        '<button class="prod-buy" id="qty-minus" style="width:30px; padding:8px 0;">−</button>' +
        '<span class="num" id="qty-val" style="font-size:13px; font-weight:700; min-width:18px; text-align:center;">1</span>' +
        '<button class="prod-buy" id="qty-plus" style="width:30px; padding:8px 0;">+</button>' +
      '</div>' +
      '<button class="prod-buy" id="prod-buy-btn">Купити</button>';
    var totalEl = card.querySelector("#prod-total");
    var qtyEl = card.querySelector("#qty-val");
    function refreshTotal(){ qtyEl.textContent = String(qty); totalEl.textContent = fmt(opts.price * qty); }
    card.querySelector("#qty-minus").addEventListener("click", function(){ if(qty>1){ qty--; refreshTotal(); } });
    card.querySelector("#qty-plus").addEventListener("click", function(){ if(qty<99){ qty++; refreshTotal(); } });
    card.querySelector("#prod-buy-btn").addEventListener("click", function(){ opts.onBuy(qty); });
    return card;
  }

  async function buyListing(listing, qty){
    qty = Math.max(1, Math.round(qty || 1));
    var total = Math.round(listing.price * qty * 100) / 100;
    var buyer = await getUser(state.email);
    if(!buyer){ showToast("Помилка синхронізації", "error"); return; }
    if(buyer.balance < total){ showToast("Недостатньо коштів", "error"); return; }
    var fresh = await getListing(listing.id);
    if(!fresh){ showToast("Оголошення вже недоступне", "error"); render(); return; }
    var seller = await getUser(listing.sellerEmail);
    if(!seller){ showToast("Продавця не знайдено", "error"); return; }

    var label = qty > 1 ? (listing.title + " ×" + qty) : listing.title;
    buyer.balance = Math.round((buyer.balance - total) * 100) / 100;
    seller.balance = Math.round((seller.balance + total) * 100) / 100;
    var now = Date.now();
    buyer.transactions.push({id:uid(), kind:"purchase", amount:-total, date: now, purpose: label + " (від " + seller.email.split("@")[0] + ")"});
    seller.transactions.push({id:uid(), kind:"sale", amount:total, date: now, purpose: label});
    addMoneyProgress(seller, total);

    await saveUser(buyer);
    await saveUser(seller);
    await deleteListing(listing.id);
    state.user = buyer;
    showToast("Куплено: " + listing.title);
    render();
  }

  // ---------- loan modal ----------
  function renderLoanModal(){
    var user = state.user;
    var maxLoan = maxLoanForLevel(user.level);
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Взяти кредит</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="info-card-sub" style="margin-bottom:14px;">Доступно до ' + fmt(maxLoan) + ' (рівень ' + user.level + '). Погашення протягом 3 днів.</div>' +
      '<div class="field"><div class="field-label">Сума кредиту</div>' +
      '<input type="text" id="loan-amount" placeholder="0" inputmode="none">' +
      '<div class="chip-row" id="loan-chips"></div></div>' +
      '<div class="err-msg" id="loan-error"></div>' +
      '<button class="btn btn-primary" id="loan-submit"><span id="loan-submit-label">Отримати кредит</span></button>';
    overlay.appendChild(modal);

    var input = modal.querySelector("#loan-amount");
    var chipsRow = modal.querySelector("#loan-chips");
    [Math.round(maxLoan*0.25), Math.round(maxLoan*0.5), Math.round(maxLoan*0.75), maxLoan]
      .filter(function(v,i,a){ return v>0 && a.indexOf(v)===i; })
      .forEach(function(v){
        var chip = document.createElement("div");
        chip.className = "amount-chip";
        chip.textContent = fmt(v);
        chip.addEventListener("click", function(){ input.value = groupThousands(String(v)); });
        chipsRow.appendChild(chip);
      });

    var errEl = modal.querySelector("#loan-error");
    var submitBtn = modal.querySelector("#loan-submit");
    var submitLabel = modal.querySelector("#loan-submit-label");

    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    input.addEventListener("input", function(){ errEl.textContent = ""; });

    submitBtn.addEventListener("click", async function(){
      var amount = readAmount(input);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму кредиту"; return; }
      submitBtn.disabled = true; input.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';

      var user2 = await getUser(state.email);
      if(!user2){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      var freshMax = maxLoanForLevel(user2.level);
      if(amount > freshMax + 0.005){
        errEl.textContent = "Максимум для вашого рівня (" + user2.level + "): " + fmt(freshMax);
        submitBtn.disabled=false; input.disabled=false; submitLabel.textContent="Отримати кредит"; return;
      }
      if(user2.loan){ errEl.textContent = "У вас вже є активний кредит"; submitBtn.disabled=false; input.disabled=false; submitLabel.textContent="Отримати кредит"; return; }

      var now = Date.now();
      user2.loan = {amount: amount, takenAt: now, dueAt: now + LOAN_TERM_MS};
      user2.balance = Math.round((user2.balance + amount) * 100) / 100;
      user2.transactions.push({id:uid(), kind:"loan_take", amount: amount, date: now, purpose:"Кредит на 3 дні"});

      await saveUser(user2);
      state.user = user2;
      closeModal();
      showToast("Кредит " + fmt(amount) + " зараховано");
    });

    attachNumpad(input, input);
    return overlay;
  }

      await saveUser(fresh);
      state.user = fresh;
      closeModal();

  async function loadCompanyBody(container){
    var myCompany = await getCompany(state.email);

    if(allCompanies.length === 0){
      leaderboardHtml += '<div class="empty-state" style="padding:20px 10px;">Поки що немає жодної компанії</div>';
    } else {
      leaderboardHtml += allCompanies.slice(0, 10).map(function(c, i){
        return '<div class="my-listing"><div class="info"><div class="title">' + (i+1) + '. ' + escapeHtml(c.name) + '</div>' +
          '<div class="price">Власник: ' + escapeHtml((c.ownerEmail||"").split("@")[0]) + '</div></div>' +
          '<div class="prod-price">' + fmt(c.capital||0) + '</div></div>';
      }).join("");
    }

    if(!myCompany){
      container.innerHTML =
        '<div class="info-card-sub" style="margin-bottom:14px;">Створіть компанію — потім вкладайте гроші: малі вклади дають до 50% прибутку, великі менший відсоток, але капітал росте.</div>' +
        '<div class="field"><div class="field-label">Назва компанії</div><input type="text" id="company-name" placeholder="Напр. ADC Trading" maxlength="40"></div>' +
        '<div class="err-msg" id="company-error"></div>' +
        '<button class="btn btn-primary" id="company-create-btn">Створити компанію</button>' + leaderboardHtml;

      container.querySelector("#company-create-btn").addEventListener("click", async function(){
        var nameInput = container.querySelector("#company-name");
        var errEl = container.querySelector("#company-error");
        var name = nameInput.value.trim();
        if(!name){ errEl.textContent = "Введіть назву компанії"; return; }
        var btn = container.querySelector("#company-create-btn");
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
        await saveCompany({ownerEmail: state.email, name: name, capital: 0, createdAt: Date.now()});
        showToast("Компанію «" + name + "» створено");
        loadCompanyBody(container);
      });
      return;
    }

    var tierRows = COMPANY_PAYOUT_TIERS.map(function(t, i){
      var prevMax = i===0 ? 0 : COMPANY_PAYOUT_TIERS[i-1].max;
      var rangeLabel = (t.max === Infinity) ? ('від ' + fmt(prevMax)) : (fmt(prevMax) + ' – ' + fmt(t.max));
      return '<div class="receipt-row"><div class="k">' + rangeLabel + '</div><div class="v">' + Math.round(t.percent*100) + '%</div></div>';
    }).join("");

    container.innerHTML =
      '<div class="info-card"><div class="info-card-title">' + escapeHtml(myCompany.name) + '</div>' +
      '<div class="info-card-sub">Капітал: <b style="color:var(--text-0);">' + fmt(myCompany.capital||0) + '</b></div></div>' +
      '<div class="field"><div class="field-label">Сума вкладу</div>' +
      '<input type="text" id="company-amount" placeholder="0" inputmode="none">' +
      '<div class="chip-row" id="company-chips"></div></div>' +
      '<div class="info-card-sub" id="company-preview" style="margin-bottom:10px;"></div>' +
      '<div class="err-msg" id="company-error"></div>' +
      '<button class="btn btn-primary" id="company-invest-btn"><span id="company-invest-label">Вкласти</span></button>' +
      '<div class="section-label" style="margin-top:20px; margin-bottom:6px;">Шкала прибутку</div>' +
      '<div class="receipt-rows">' + tierRows + '</div>' + leaderboardHtml;

    var amountInput = container.querySelector("#company-amount");
    var previewEl = container.querySelector("#company-preview");
    var errEl = container.querySelector("#company-error");
    var chipsRow = container.querySelector("#company-chips");
    [500, 2000, 10000, 50000].forEach(function(v){
      var chip = document.createElement("div");
      chip.className = "amount-chip";
      chip.textContent = fmt(v);
      chip.addEventListener("click", function(){ amountInput.value = groupThousands(String(v)); updatePreview(); });
      chipsRow.appendChild(chip);
    });
    attachNumpad(amountInput, amountInput);

    function updatePreview(){
      var amt = readAmount(amountInput);
      if(!amt || amt <= 0){ previewEl.textContent = ""; return; }
      var pct = companyPayoutPercent(amt);
      previewEl.innerHTML = 'Ви отримаєте одразу <b style="color:var(--success);">+' + fmt(amt*pct) + '</b> (' + Math.round(pct*100) + '%), а ' + fmt(amt) + ' поповнить капітал.';
    }
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; updatePreview(); });

    var investBtn = container.querySelector("#company-invest-btn");
    var investLabel = container.querySelector("#company-invest-label");
    investBtn.addEventListener("click", async function(){
      var amt = readAmount(amountInput);
      if(!amt || amt <= 0){ errEl.textContent = "Введіть суму вкладу"; return; }
      investBtn.disabled = true; amountInput.disabled = true; investLabel.innerHTML = '<span class="spinner"></span>';

      var freshUser = await getUser(state.email);
      var freshCompany = await getCompany(state.email);
      if(!freshUser || !freshCompany){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      if(freshUser.balance < amt){
        errEl.textContent = "Недостатньо коштів";
        investBtn.disabled=false; amountInput.disabled=false; investLabel.textContent="Вкласти"; return;
      }
      var pct = companyPayoutPercent(amt);
      var payout = Math.round(amt * pct * 100) / 100;
      var now = Date.now();
      freshUser.balance = Math.round((freshUser.balance - amt + payout) * 100) / 100;
      freshUser.transactions.push({id:uid(), kind:"company_invest", amount:-amt, date: now, purpose:"Вклад у компанію «" + freshCompany.name + "»"});
      freshUser.transactions.push({id:uid(), kind:"company_payout", amount: payout, date: now, purpose:"Прибуток від компанії (" + Math.round(pct*100) + "%)"});
      addMoneyProgress(freshUser, payout);
      freshCompany.capital = Math.round(((freshCompany.capital||0) + amt) * 100) / 100;
      await saveUser(freshUser);
      await saveCompany(freshCompany);
      state.user = freshUser;
      showToast("Вкладено " + fmt(amt) + ", отримано +" + fmt(payout));
      closeModal();
    });
  }

        '<div class="info-card-sub" style="margin-bottom:10px;">Торкніться картки, щоб змінити дизайн або активувати її.</div>' +
        '<div style="display:flex; flex-direction:column; gap:8px;">' + rows + '</div>' +
        (cards.length < MAX_CARDS_PER_USER
          ? '<button class="btn btn-primary" id="new-card-btn" style="margin-top:16px;">+ Додати картку (' + cards.length + '/' + MAX_CARDS_PER_USER + ')</button>'
          : '<div class="info-card-sub" style="margin-top:16px; text-align:center;">Максимум ' + MAX_CARDS_PER_USER + ' карток</div>');

      body.querySelectorAll(".my-listing").forEach(function(row){
        row.addEventListener("click", function(e){
          if(e.target.closest(".del-btn")) return;
          var id = row.getAttribute("data-card-id");
          var card = (state.user.cards || []).filter(function(c){ return c.id === id; })[0];
          if(card) renderEditStep(card);
        });
      });
      body.querySelectorAll(".del-btn").forEach(function(btn){
        btn.addEventListener("click", async function(e){
          e.stopPropagation();
          var id = btn.getAttribute("data-del-id");
          var fresh = await getUser(state.email);
          if(!fresh || fresh.cards.length <= 1) return;
          var removed = fresh.cards.filter(function(c){ return c.id === id; })[0];
          fresh.cards = fresh.cards.filter(function(c){ return c.id !== id; });
          if(fresh.activeCardId === id) fresh.activeCardId = fresh.cards[0].id;
          if(removed) await storageDelete("cardindex:" + removed.digits);
          await saveUser(fresh);
          state.user = fresh;
          renderList();
          showToast("Картку видалено");
        });
      });
      var newBtn = body.querySelector("#new-card-btn");
      if(newBtn) newBtn.addEventListener("click", function(){ renderTierStep(null); });
    }

    function renderTierStep(existingCard){
      var isEdit = !!existingCard;
      var selectedTierIdx = isEdit
        ? Math.max(0, CARD_TIERS.map(function(t){return t.id;}).indexOf(existingCard.tier || "standard"))
        : 0;

      body.innerHTML =
        '<div class="field"><div class="field-label">Назва картки</div>' +
        '<input type="text" id="card-name" placeholder="Напр. На покупки" maxlength="24" value="' + escapeHtml(isEdit ? (existingCard.label||"") : "") + '"></div>' +
        '<div class="field-label">Дизайн</div>' +
        '<div class="chip-row" id="tier-row" style="flex-direction:column;"></div>' +
        '<div class="info-card-sub" id="tier-price" style="margin:6px 0 14px;"></div>' +
        '<div class="err-msg" id="card-error"></div>' +
        '<button class="btn btn-primary" id="card-submit"><span id="card-label">' + (isEdit ? "Зберегти й активувати" : "Створити") + '</span></button>' +
        '<button class="btn btn-ghost" id="card-cancel" style="margin-top:8px;">Назад</button>';

      var tierRow = body.querySelector("#tier-row");
      var priceEl = body.querySelector("#tier-price");
      var errEl = body.querySelector("#card-error");
      var owned = state.user.ownedTiers || ["standard"];

      function paintTiers(){
        tierRow.innerHTML = CARD_TIERS.map(function(t, i){
          return '<div class="amount-chip' + (i===selectedTierIdx?" active":"") + '" data-idx="' + i + '" style="width:100%; display:flex; justify-content:space-between; align-items:center;">' +
            '<span style="display:flex; align-items:center; gap:10px;"><span style="width:28px;height:18px;border-radius:4px;background:' + t.face + ';display:inline-block;"></span>' + t.name + '</span>' +
            '<span style="font-size:11px; color:var(--text-2);">' + (t.price===0 ? "безкоштовно" : (owned.indexOf(t.id)!==-1 ? "куплено" : fmt(t.price))) + '</span></div>';
        }).join("");
        tierRow.querySelectorAll("[data-idx]").forEach(function(el){
          el.addEventListener("click", function(){ selectedTierIdx = parseInt(el.getAttribute("data-idx"),10); paintTiers(); });
        });
        var t = CARD_TIERS[selectedTierIdx];
        var isOwned = owned.indexOf(t.id) !== -1;
        priceEl.innerHTML = (t.price === 0 || isOwned)
          ? t.sub
          : 'Вартість: <b style="color:var(--text-0);">' + fmt(t.price) + '</b>';
      }
      paintTiers();

      body.querySelector("#card-cancel").addEventListener("click", renderList);
      body.querySelector("#card-submit").addEventListener("click", async function(){
        var name = body.querySelector("#card-name").value.trim();
        if(!name){ errEl.textContent = "Введіть назву картки"; return; }
        var submitBtn = body.querySelector("#card-submit");
        var label = body.querySelector("#card-label");
        submitBtn.disabled = true; label.innerHTML = '<span class="spinner"></span>';

        var fresh = await getUser(state.email);
        if(!fresh){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
        var tier = CARD_TIERS[selectedTierIdx];
        var freshOwned = fresh.ownedTiers || ["standard"];
        var mustPay = tier.price > 0 && freshOwned.indexOf(tier.id) === -1;
        if(mustPay && fresh.balance < tier.price){
          errEl.textContent = "Недостатньо коштів для цього дизайну";
          submitBtn.disabled=false; label.textContent = isEdit ? "Зберегти й активувати" : "Створити"; return;
        }
        if(mustPay){
          fresh.balance = Math.round((fresh.balance - tier.price) * 100) / 100;
          fresh.transactions.push({id:uid(), kind:"card_buy", amount:-tier.price, date: Date.now(), purpose:"Картка «" + name + "» (" + tier.name + ")"});
          fresh.ownedTiers = freshOwned.concat([tier.id]);
        }

        if(isEdit){
          var target = fresh.cards.filter(function(c){ return c.id === existingCard.id; })[0];
          if(!target){ errEl.textContent = "Картку не знайдено"; submitBtn.disabled=false; return; }
          target.label = name; target.tier = tier.id;
          fresh.activeCardId = target.id;
        } else {
          if(fresh.cards.length >= MAX_CARDS_PER_USER){ errEl.textContent = "Досягнуто ліміт карток"; submitBtn.disabled=false; return; }
          var digits = await generateUniqueCard();
          var newCard = {id: uid(), digits: digits, label: name, tier: tier.id, createdAt: Date.now()};
          fresh.cards.push(newCard);
          fresh.activeCardId = newCard.id;
          await reserveCard(digits, state.email);
        }
        await saveUser(fresh);
        state.user = fresh;
        showToast(isEdit ? "Картку оновлено" : "Картку створено!", "gold");
        renderList();
      });
    }
    function renderEditStep(card){ renderTierStep(card); }

    renderList();
    return overlay;
  }

  // ---------- transfer ----------
  async function performTransfer(receiverEmail, amount){
    if(receiverEmail === state.email) return {ok:false, error:"Не можна переказати самому собі"};
    var sender = await getUser(state.email);
    if(!sender) return {ok:false, error:"Помилка синхронізації"};
    if(!amount || amount <= 0) return {ok:false, error:"Введіть суму переказу"};
    if(amount > sender.balance) return {ok:false, error:"Недостатньо коштів"};
    var receiver = await getUser(receiverEmail);
    if(!receiver) return {ok:false, error:"Отримувача не знайдено"};

    sender.balance = Math.round((sender.balance - amount) * 100) / 100;
    receiver.balance = Math.round((receiver.balance + amount) * 100) / 100;
    var now = Date.now();
    var senderCardDigits = activeCard(sender).digits;
    var receiverCardDigits = activeCard(receiver).digits;
    var txOut = {id: uid(), kind:"transfer_out", amount:-amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
    var txIn = {id: uid(), kind:"transfer_in", amount: amount, date: now, senderCard: senderCardDigits, receiverCard: receiverCardDigits, purpose:"Переказ коштів"};
    sender.transactions.push(txOut);
    receiver.transactions.push(txIn);
    addMoneyProgress(receiver, amount);
    await saveUser(sender);
    await saveUser(receiver);
    state.user = sender;
    return {ok:true, txOut: txOut};
  }

  async function addFriendByEmail(rawEmail){
    var norm = normalizeEmail(rawEmail);
    if(!isValidEmail(norm)) return {ok:false, error:"Введіть коректний email"};
    if(norm === state.email) return {ok:false, error:"Це ваш власний email"};
    var fresh = await getUser(state.email);
    if(!fresh) return {ok:false, error:"Помилка синхронізації"};
    fresh.friends = fresh.friends || [];
    if(fresh.friends.some(function(f){ return f.email === norm; })) return {ok:false, error:"Вже у друзях"};
    var target = await getUser(norm);
    if(!target) return {ok:false, error:"Гравця з таким email не існує"};
    fresh.friends.push({email: norm, addedAt: Date.now()});
    await saveUser(fresh);
    state.user = fresh;
    return {ok:true};
  }

  function avatarColorFor(str){
    var palette = ["#22c55e","#a3e635","#30d158","#ffb020","#0aa8ff","#c9a961"];
    var sum = 0;
    for(var i=0;i<str.length;i++) sum += str.charCodeAt(i);
    return palette[sum % palette.length];
  }

  function renderTransferModal(){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Переказ</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="field" style="margin-bottom:10px;"><input type="text" id="tr-search" placeholder="🔍 Пошук серед друзів"></div>' +
      '<div class="market-tabs" style="margin-top:0;">' +
        '<div class="mtab active" data-tr-tab="friends">Друзі</div>' +
        '<div class="mtab" data-tr-tab="card">За номером картки</div>' +
      '</div><div id="tr-body" style="margin-top:14px;"></div>';
    overlay.appendChild(modal);
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);

    var body = modal.querySelector("#tr-body");
    var searchInput = modal.querySelector("#tr-search");
    var curTab = "friends";

    modal.querySelectorAll("[data-tr-tab]").forEach(function(el){
      el.addEventListener("click", function(){
        curTab = el.getAttribute("data-tr-tab");
        modal.querySelectorAll("[data-tr-tab]").forEach(function(t){ t.classList.toggle("active", t===el); });
        searchInput.style.display = curTab === "friends" ? "" : "none";
        renderTabBody();
      });
    });
    searchInput.addEventListener("input", function(){ if(curTab === "friends") renderFriendsList(); });

    function renderTabBody(){ if(curTab === "friends") renderFriendsList(); else renderCardForm(); }

    function renderFriendsList(){
      var friends = state.user.friends || [];
      var q = (searchInput.value || "").trim().toLowerCase();
      var filtered = q ? friends.filter(function(f){ return f.email.toLowerCase().indexOf(q) !== -1; }) : friends;
      var addRow = '<div class="my-listing" id="add-friend-row" style="cursor:pointer;">' +
        '<div class="avatar" style="border:none; background:var(--bg-2); font-size:18px;">+</div>' +
        '<div class="info"><div class="title" style="color:#22c55e;">Додати друга</div></div></div>';
      var rows = filtered.map(function(f){
        return '<div class="my-listing tr-friend-row" data-friend-email="' + escapeHtml(f.email) + '" style="cursor:pointer;">' +
          '<div class="avatar" style="border:none; background:' + avatarColorFor(f.email) + '; color:#fff; font-weight:800;">' + f.email[0].toUpperCase() + '</div>' +
          '<div class="info"><div class="title">' + escapeHtml(f.email.split("@")[0]) + '</div>' +
          '<div class="price">' + escapeHtml(f.email) + '</div></div></div>';
      }).join("");
      body.innerHTML = '<div style="display:flex; flex-direction:column; gap:6px;">' + addRow + rows + '</div>' +
        (friends.length === 0 ? '<div class="empty-state">Поки немає друзів — додайте першого!</div>' : '');
      body.querySelector("#add-friend-row").addEventListener("click", renderAddFriendForm);
      body.querySelectorAll(".tr-friend-row").forEach(function(row){
        row.addEventListener("click", function(){ renderAmountForm({email: row.getAttribute("data-friend-email")}); });
      });
    }

    function renderAddFriendForm(){
      body.innerHTML =
        '<div class="info-card-sub" style="margin-bottom:12px;">Введіть email гравця, щоб додати його в друзі.</div>' +
        '<div class="field"><input type="text" id="new-friend-email" placeholder="friend@example.com" autocapitalize="off" spellcheck="false"></div>' +
        '<div class="err-msg" id="add-friend-error"></div>' +
        '<button class="btn btn-primary" id="add-friend-submit"><span id="add-friend-label">Додати</span></button>' +
        '<button class="btn btn-ghost" id="add-friend-cancel" style="margin-top:8px;">Назад</button>';
      var emailInput = body.querySelector("#new-friend-email");
      var errEl = body.querySelector("#add-friend-error");
      body.querySelector("#add-friend-cancel").addEventListener("click", renderFriendsList);
      body.querySelector("#add-friend-submit").addEventListener("click", async function(){
        var btn = body.querySelector("#add-friend-submit");
        var label = body.querySelector("#add-friend-label");
        btn.disabled = true; label.innerHTML = '<span class="spinner"></span>';
        var res = await addFriendByEmail(emailInput.value);
        if(!res.ok){ errEl.textContent = res.error; btn.disabled=false; label.textContent="Додати"; return; }
        showToast("Друга додано!");
        renderFriendsList();
      });
      setTimeout(function(){ emailInput.focus(); }, 200);
    }

    function renderAmountForm(target){
      var label = target.email ? target.email.split("@")[0] : maskCard(target.cardDigits);
      body.innerHTML =
        '<div class="info-card" style="text-align:center; margin-top:0;"><div class="info-card-sub">Отримувач</div><div class="info-card-title">' + escapeHtml(label) + '</div></div>' +
        '<div class="field" style="margin-top:14px;"><div class="field-label">Сума</div>' +
        '<input type="text" id="tr-amount" placeholder="0" inputmode="none"></div>' +
        '<div class="err-msg" id="tr-error"></div>' +
        '<button class="btn btn-primary" id="tr-submit" style="margin-top:8px;"><span id="tr-submit-label">Переказати</span></button>' +
        '<button class="btn btn-ghost" id="tr-back" style="margin-top:8px;">Назад</button>';
      var amountInput = body.querySelector("#tr-amount");
      var errEl = body.querySelector("#tr-error");
      var submitBtn = body.querySelector("#tr-submit");
      var submitLabel = body.querySelector("#tr-submit-label");
      body.querySelector("#tr-back").addEventListener("click", renderTabBody);
      amountInput.addEventListener("input", function(){ errEl.textContent = ""; });
      submitBtn.addEventListener("click", async function(){
        var amount = readAmount(amountInput);
        if(!amount || amount <= 0){ errEl.textContent = "Введіть суму переказу"; return; }
        submitBtn.disabled = true; amountInput.disabled = true;
        submitLabel.innerHTML = '<span class="spinner"></span>';
        var receiverEmail = target.email;
        if(!receiverEmail){
          receiverEmail = await getCardOwnerEmail(target.cardDigits);
          if(!receiverEmail){
            errEl.textContent = "Картку не знайдено";
            submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
          }
        }
        var res = await performTransfer(receiverEmail, amount);
        if(!res.ok){
          errEl.textContent = res.error;
          submitBtn.disabled=false; amountInput.disabled=false; submitLabel.textContent="Переказати"; return;
        }
        state.modal = {type:"receipt", tx: res.txOut};
        render();
        showToast("Переказано " + fmt(amount));
      });
      attachNumpad(amountInput, amountInput);
    }

    function renderCardForm(){
      body.innerHTML =
        '<div class="field"><div class="field-label">Номер картки отримувача</div>' +
        '<input type="text" id="tr-card" class="num" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19"></div>' +
        '<div class="err-msg" id="tr-card-error"></div>' +
        '<button class="btn btn-primary" id="tr-card-next">Далі</button>';
      var cardInput = body.querySelector("#tr-card");
      var errEl = body.querySelector("#tr-card-error");
      cardInput.addEventListener("input", function(){
        var digits = cardDigitsOnly(cardInput.value).slice(0,16);
        cardInput.value = digits.replace(/(.{4})/g,"$1 ").trim();
        errEl.textContent = "";
      });
      body.querySelector("#tr-card-next").addEventListener("click", function(){
        var digits = cardDigitsOnly(cardInput.value);
        if(digits.length !== 16){ errEl.textContent = "Введіть коректний номер картки (16 цифр)"; return; }
        renderAmountForm({cardDigits: digits});
      });
      setTimeout(function(){ cardInput.focus(); }, 200);
    }

    renderFriendsList();
    return overlay;
  }

  // ---------- topup (admin) ----------
  function renderTopupModal(){
    if(state.email !== ADMIN_EMAIL){ state.modal = null; return document.createElement("div"); }
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Поповнення (адмін)</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="field"><div class="field-label">Сума поповнення</div>' +
      '<input type="text" id="tp-amount" placeholder="0" inputmode="none"></div>' +
      '<div class="err-msg" id="tp-error"></div>' +
      '<button class="btn btn-primary" id="tp-submit" style="margin-top:8px;"><span id="tp-submit-label">Поповнити</span></button>';
    overlay.appendChild(modal);

    var amountInput = modal.querySelector("#tp-amount");
    var errEl = modal.querySelector("#tp-error");
    var submitBtn = modal.querySelector("#tp-submit");
    var submitLabel = modal.querySelector("#tp-submit-label");
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    amountInput.addEventListener("input", function(){ errEl.textContent = ""; });

    submitBtn.addEventListener("click", async function(){
      var amount = readAmount(amountInput);
      if(!amount || amount <= 0){ errEl.textContent = "Введіть суму поповнення"; return; }
      submitBtn.disabled = true; amountInput.disabled = true;
      submitLabel.innerHTML = '<span class="spinner"></span>';
      var user = await getUser(state.email);
      if(!user){ showToast("Помилка синхронізації", "error"); closeModal(); return; }
      user.balance = Math.round((user.balance + amount) * 100) / 100;
      var tx = {id: uid(), kind:"topup", amount: amount, date: Date.now(), receiverCard: activeCard(user).digits, purpose:"Демо-поповнення"};
      user.transactions.push(tx);
      await saveUser(user);
      state.user = user;
      state.modal = {type:"receipt", tx:tx};
      render();
      showToast("Баланс поповнено на " + fmt(amount));
    });

    attachNumpad(amountInput, amountInput);
    return overlay;
  }

  // ---------- receipt ----------
  function renderReceiptModal(tx){
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    var modal = document.createElement("div");
    modal.className = "modal";
    var isGoldKind = tx.kind === "vip_buy" || tx.kind === "vip_payout" || tx.kind === "marshal_payout";
    var isTopup = tx.kind === "topup" || tx.kind === "bonus";
    var isOut = tx.amount < 0 && !isTopup;
    var avatarClass = isGoldKind ? "gold" : (isTopup ? "topup" : (isOut ? "out" : "in"));
    var avatarIcon = isGoldKind ? ICONS.crown : (isTopup ? ICONS.plus : (isOut ? ICONS.txOut : ICONS.txIn));
    var heading = tx.purpose || (tx.amount > 0 ? "Надходження" : "Списання");

    var rows = "";
    if(tx.senderCard) rows += receiptRow("Картка відправника", maskCard(tx.senderCard), true);
    if(tx.receiverCard) rows += receiptRow("Картка отримувача", maskCard(tx.receiverCard), true);
    if(tx.purpose) rows += receiptRow("Призначення", tx.purpose);
    rows += receiptRow("Сума операції", fmt(Math.abs(tx.amount)));
    rows += receiptRow("Комісія", "0,00 " + CUR);
    rows += '<div class="receipt-row"><div class="k">Статус</div><div class="v"><span class="badge-ok">' + ICONS.checkCircle + ' Виконано (демо)</span></div></div>';

    modal.innerHTML =
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Квитанція</h2><button class="close-x" id="modal-close">&times;</button></div>' +
      '<div class="receipt-hero"><div class="receipt-avatar ' + avatarClass + '">' + avatarIcon + '</div>' +
      '<div class="receipt-status">' + escapeHtml(heading) + '</div>' +
      '<div class="receipt-sub">' + formatDate(tx.date) + '</div></div>' +
      '<div class="receipt-rows">' + rows + '</div>' +
      '<button class="btn btn-ghost" id="receipt-close-btn" style="margin-top:20px;">Готово</button>';
    overlay.appendChild(modal);
    overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
    modal.querySelector("#modal-close").addEventListener("click", closeModal);
    modal.querySelector("#receipt-close-btn").addEventListener("click", closeModal);
    return overlay;
  }

  function receiptRow(label, value, isNum){
    return '<div class="receipt-row"><div class="k">' + escapeHtml(label) + '</div><div class="v' + (isNum ? " num" : "") + '">' + escapeHtml(value) + '</div></div>';
  }

  // ---------- boot ----------
  async function boot(){
    state.screen = "loading";
    render();
    loadPhoneCatalog();
    var savedEmail = getSession();
    if(savedEmail){
      var user = null;
      try{ user = await getUser(savedEmail); }catch(e){ user = null; }
      if(user){
        state.email = savedEmail; state.user = user; state.screen = "home";
        render();
        startTimers();
        return;
      } else {
        setSession(null); state.screen = "email";
      }
    } else {
      state.screen = "email";
    }
    render();
  }

  boot();
})();
</script>
</body>
